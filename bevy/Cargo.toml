[package]
name = "maplibre-bevy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MapLibre maps in Bevy apps, drawn by mln-rs on Bevy's wgpu renderer"
repository = "https://github.com/birkskyum/maplibre-rust-ui"
homepage = "https://birkskyum.github.io/maplibre-rust-ui/hosts/bevy/"
documentation = "https://birkskyum.github.io/maplibre-rust-ui/hosts/bevy/"
readme = "README.md"
keywords = ["maplibre", "map", "bevy", "gis", "gui"]
categories = ["gui", "game-development", "science::geo"]

[workspace]
members = ["examples/hello-map"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_render", "bevy_sprite_render", "bevy_ui", "bevy_window"] }
maplibre-rust-ui = { path = "../core", version = "0.1.0" }
