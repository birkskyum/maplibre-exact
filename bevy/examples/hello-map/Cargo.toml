[package]
name = "hello-map-bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A Bevy app with a MapLibre map"
publish = false

[dependencies]
bevy = { version = "0.20", features = ["system_font_discovery"] }
maplibre-bevy = { path = "../.." }
serde_json = "1"
# Only for HELLO_MAP_SNAPSHOTS, whose walk saves the app as PNG files.
png = "0.18"
