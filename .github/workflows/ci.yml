# Builds, lints and tests the core and each host against mln-rs at the
# commit the hosts build on. Exact's host builds only through Exact's own
# tooling, so it isn't here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MLN_RS: 1102a74c3c03039179feb1d9d182430a8264927f
  CARGO_TERM_COLOR: always

jobs:
  crate:
    name: ${{ matrix.crate }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        crate: [core, slint, egui, bevy, nsh, whisker]
    steps:
      - uses: actions/checkout@v7
        with:
          path: maplibre-rust-ui
      - uses: actions/checkout@v7
        with:
          repository: louwers/mln-rs
          ref: ${{ env.MLN_RS }}
          path: mln-rs
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: maplibre-rust-ui/${{ matrix.crate }}
      - name: Format
        working-directory: maplibre-rust-ui/${{ matrix.crate }}
        run: cargo fmt --all --check
      - name: Lint
        working-directory: maplibre-rust-ui/${{ matrix.crate }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        working-directory: maplibre-rust-ui/${{ matrix.crate }}
        run: cargo test --workspace
