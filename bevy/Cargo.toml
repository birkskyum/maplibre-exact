[package]
name = "maplibre-bevy"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "MapLibre maps in Bevy apps, drawn by mln-rs on Bevy's wgpu renderer"
publish = false

[workspace]
members = ["examples/hello-map"]

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["bevy_render", "bevy_sprite_render", "bevy_ui", "bevy_window"] }
maplibre-rust-ui = { path = "../core" }
