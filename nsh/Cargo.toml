[package]
name = "maplibre-nsh"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MapLibre maps in Native Shell apps, drawn by mln-rs into a native view"
repository = "https://github.com/birkskyum/maplibre-rust-ui"
homepage = "https://birkskyum.github.io/maplibre-rust-ui/hosts/nsh/"
documentation = "https://birkskyum.github.io/maplibre-rust-ui/hosts/nsh/"
readme = "README.md"
keywords = ["maplibre", "map", "native-shell", "gis", "gui"]
categories = ["gui", "science::geo"]

[workspace]
members = ["examples/hello-map"]

[dependencies]
maplibre-rust-ui = { path = "../core", version = "0.1.0" }
nsh-core = "0.5.0"
serde_json = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSDate",
    "NSEnumerator",
    "NSGeometry",
    "NSObjCRuntime",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSTimer",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.5.0", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "UIEvent",
    "UIResponder",
    "UITouch",
    "UITraitCollection",
    "UIView",
    "objc2-core-foundation",
    "objc2-quartz-core",
] }
