[package]
name = "hello-map-gpui"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A GPUI app with a MapLibre map"
publish = false

[dependencies]
gpui = { path = "../../../../zed/crates/gpui" }
maplibre-gpui = { path = "../.." }
serde_json = "1"

# GPUI's Mac platform itself: its gpui_platform takes the web platform too,
# whose exact unicode-properties mln-rs can't share.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { path = "../../../../zed/crates/gpui_macos", features = ["font-kit"] }

# The walk runs the app offscreen, in GPUI's headless context with its Metal
# renderer, and saves its frames.
[dev-dependencies]
gpui = { path = "../../../../zed/crates/gpui", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { path = "../../../../zed/crates/gpui_apple", features = ["font-kit"] }
gpui_macos = { path = "../../../../zed/crates/gpui_macos", features = ["font-kit", "test-support"] }
