[package]
name = "hello-map-slint"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A Slint app with a MapLibre map"
publish = false

[dependencies]
maplibre-slint = { path = "../.." }
serde_json = "1"
slint = { version = "1.18", features = ["unstable-wgpu-30", "renderer-femtovg-wgpu"] }
# Only for HELLO_MAP_SNAPSHOTS, which saves the window as PNG files.
png = "0.18"

[build-dependencies]
slint-build = "1.18"
