[package]
name = "hello-map-egui"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "An egui app with a MapLibre map"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
maplibre-egui = { path = "../.." }
serde_json = "1"

# The walk runs the app offscreen, in egui's test harness, and saves its frames.
[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
